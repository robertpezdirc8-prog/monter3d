<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera3D Pro - Testi konstrukcije ograje</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }
        h1 {
            color: #10b981;
            border-bottom: 2px solid #10b981;
            padding-bottom: 10px;
        }
        .test-suite {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .test-suite h2 {
            color: #3b82f6;
            margin-top: 0;
        }
        .test-result {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .test-pass {
            background: #064e3b;
            border-left: 4px solid #10b981;
        }
        .test-fail {
            background: #7f1d1d;
            border-left: 4px solid #ef4444;
        }
        .summary {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .summary-stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 48px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 14px;
            color: #94a3b8;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>🧪 Mera3D Pro - Testi konstrukcije ograje</h1>
    
    <div class="summary">
        <h2>Status testov</h2>
        <div id="status" class="loading">
            Pritisnite gumb za zagon testov...
        </div>
        <button id="runTests" onclick="runAllTests()">▶ Zaženi teste</button>
        <button id="runBuild" onclick="window.location.href='/#/tests'">📊 Odpri matematične teste</button>
    </div>

    <div id="results"></div>

    <script type="module">
        import { calculateFenceConstruction, validateFenceConfiguration } from '/src/utils/fenceConstruction.ts';
        import { ROKSAL_PROFILES } from '/src/data/roksalCatalog.ts';

        const testResults = [];

        function addResult(suite, name, passed, expected, actual) {
            testResults.push({ suite, name, passed, expected, actual });
        }

        function runAllTests() {
            document.getElementById('runTests').disabled = true;
            document.getElementById('status').innerHTML = 'Izvajam teste...';
            document.getElementById('results').innerHTML = '';

            const polna57 = ROKSAL_PROFILES.find(p => p.id === 'polna-deska-57-32');
            const polna100 = ROKSAL_PROFILES.find(p => p.id === 'polna-deska-100');
            const polna128 = ROKSAL_PROFILES.find(p => p.id === 'polna-deska-128');
            const romb67 = ROKSAL_PROFILES.find(p => p.id === 'romb-deska-67');
            const deska150 = ROKSAL_PROFILES.find(p => p.id === 'deska-150');
            const kubo = ROKSAL_PROFILES.find(p => p.id === 'kubo-80-42');

            // Test 1: Dolžina 121mm, širina 100mm, razmik 20mm
            try {
                const result = calculateFenceConstruction({
                    profile: polna100,
                    orientation: 'vertical',
                    fenceHeight: 1000,
                    fenceLength: 121,
                    boardSpacing: 20
                });
                addResult('Robni primeri', 'Dolžina 121mm, širina 100mm, razmik 20mm', 
                    !result.valid && result.errors.length > 0,
                    'neveljavno', `valid: ${result.valid}, errors: ${result.errors.length}`);
            } catch (e) {
                addResult('Robni primeri', 'Dolžina 121mm', false, 'neveljavno', `napaka: ${e.message}`);
            }

            // Test 2: Ena deska brez razmika
            try {
                const result = calculateFenceConstruction({
                    profile: polna100,
                    orientation: 'vertical',
                    fenceHeight: 1000,
                    fenceLength: 100,
                    boardSpacing: 0
                });
                addResult('Robni primeri', 'Ena deska brez razmika',
                    result.numberOfBoards === 1 && result.actualBoardSpacing === 0,
                    '1 deska, razmik 0', `${result.numberOfBoards} desk, razmik ${result.actualBoardSpacing}`);
            } catch (e) {
                addResult('Robni primeri', 'Ena deska', false, '1 deska', `napaka: ${e.message}`);
            }

            // Test 3: 3 kosi po 1200mm iz 2200mm
            try {
                const result = calculateFenceConstruction({
                    profile: polna128,
                    orientation: 'vertical',
                    fenceHeight: 1200,
                    fenceLength: 3000,
                    boardSpacing: 20
                });
                addResult('Načrt rezanja', '3 kosi po 1200mm iz 2200mm',
                    result.cutsPerProfile === 1 && result.profilesNeeded >= 3,
                    'cutsPerProfile=1, profilesNeeded>=3', 
                    `cutsPerProfile=${result.cutsPerProfile}, profilesNeeded=${result.profilesNeeded}`);
            } catch (e) {
                addResult('Načrt rezanja', '3 kosi po 1200mm', false, 'cutsPerProfile=1', `napaka: ${e.message}`);
            }

            // Test 4: ROMB brez ALU cevi
            try {
                const result = calculateFenceConstruction({
                    profile: romb67,
                    orientation: 'horizontal',
                    fenceHeight: 1000,
                    fenceLength: 1000,
                    boardSpacing: 20
                });
                addResult('Tehnična združljivost', 'ROMB 67 zahteva ALU cev',
                    result.requiresAluminumTube === true,
                    'requiresAluminumTube=true', `requiresAluminumTube=${result.requiresAluminumTube}`);
            } catch (e) {
                addResult('Tehnična združljivost', 'ROMB ALU', false, 'true', `napaka: ${e.message}`);
            }

            // Test 5: POLNA 100 prečno
            try {
                const result = calculateFenceConstruction({
                    profile: polna100,
                    orientation: 'horizontal',
                    fenceHeight: 1000,
                    fenceLength: 3000,
                    boardSpacing: 20
                });
                addResult('Tehnična združljivost', 'POLNA 100 prečno - nedovoljeno',
                    !result.valid && result.errors.length > 0,
                    'neveljavno', `valid: ${result.valid}, errors: ${result.errors.length}`);
            } catch (e) {
                addResult('Tehnična združljivost', 'POLNA 100 prečno', false, 'neveljavno', `napaka: ${e.message}`);
            }

            // Test 6: Razmak stebričkov 3500mm
            try {
                const result = calculateFenceConstruction({
                    profile: polna57,
                    orientation: 'vertical',
                    fenceHeight: 1000,
                    fenceLength: 3500,
                    boardSpacing: 20
                });
                addResult('Izračun stebričkov', '3500mm, max 1500mm',
                    result.numberOfPosts >= 3 && result.actualPostSpacing <= 1500,
                    'posts>=3, spacing<=1500', 
                    `posts=${result.numberOfPosts}, spacing=${result.actualPostSpacing}`);
            } catch (e) {
                addResult('Izračun stebričkov', '3500mm', false, 'posts>=3', `napaka: ${e.message}`);
            }

            // Display results
            displayResults();
        }

        function displayResults() {
            const passed = testResults.filter(r => r.passed).length;
            const failed = testResults.filter(r => !r.passed).length;
            const total = testResults.length;

            document.getElementById('status').innerHTML = `
                <div class="summary-stats">
                    <div class="stat">
                        <div class="stat-number" style="color: #10b981;">${passed}</div>
                        <div class="stat-label">Uspešnih</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" style="color: #ef4444;">${failed}</div>
                        <div class="stat-label">Neuspešnih</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">${total}</div>
                        <div class="stat-label">Skupaj</div>
                    </div>
                </div>
                <div style="font-size: 24px; color: ${failed === 0 ? '#10b981' : '#ef4444'};">
                    ${failed === 0 ? '✅ Vsi testi uspešni!' : '❌ Nekateri testi neuspešni'}
                </div>
            `;

            // Group by suite
            const suites = {};
            testResults.forEach(r => {
                if (!suites[r.suite]) suites[r.suite] = [];
                suites[r.suite].push(r);
            });

            let html = '';
            for (const [suite, results] of Object.entries(suites)) {
                html += `<div class="test-suite"><h2>${suite}</h2>`;
                results.forEach(r => {
                    const className = r.passed ? 'test-pass' : 'test-fail';
                    const icon = r.passed ? '✓' : '✗';
                    html += `
                        <div class="test-result ${className}">
                            <strong>${icon} ${r.name}</strong><br>
                            Pričakovano: ${r.expected}<br>
                            Dejansko: ${r.actual}
                        </div>
                    `;
                });
                html += '</div>';
            }

            document.getElementById('results').innerHTML = html;
            document.getElementById('runTests').disabled = false;
        }

        window.runAllTests = runAllTests;
    </script>
</body>
</html>
