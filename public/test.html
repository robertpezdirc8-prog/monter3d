<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mera3D Pro - Celovit testni komplet</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 1200px; margin: 0 auto; }
    h1 { color: #10b981; border-bottom: 3px solid #10b981; padding-bottom: 10px; }
    h2 { color: #60a5fa; margin-top: 30px; border-left: 4px solid #60a5fa; padding-left: 10px; }
    .test-section { background: #1e293b; border-radius: 8px; padding: 15px; margin: 15px 0; }
    .pass { color: #10b981; font-weight: 600; }
    .fail { color: #ef4444; font-weight: 600; }
    .info { color: #94a3b8; }
    .summary { background: #1e293b; border-radius: 12px; padding: 25px; margin-top: 30px; border: 2px solid #10b981; }
    .summary h2 { border: none; padding: 0; margin: 0 0 15px 0; }
    .test-result { margin: 5px 0; padding: 5px 10px; border-radius: 4px; }
    .test-result.pass { background: rgba(16, 185, 129, 0.1); }
    .test-result.fail { background: rgba(239, 68, 68, 0.1); }
    button { background: #10b981; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin: 10px 5px; }
    button:hover { background: #059669; }
    .warning { background: rgba(245, 158, 11, 0.1); border-left: 4px solid #f59e0b; padding: 10px; margin: 10px 0; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🧪 Mera3D Pro - Celovit testni komplet</h1>
  <p class="info">Avtomatizirani testi za preverjanje pravilnosti algoritmov, geometrije in izvozov.</p>
  
  <button onclick="runAllTests()">▶ Zaženi vse teste</button>
  <button onclick="clearOutput()">🗑 Počisti</button>
  
  <div id="output"></div>
  
  <script type="module">
    import { toGrayscale, gaussianBlur, harrisCornerDetection, computeDescriptors, crossCheckMatch, estimateHomography, ransacHomography, assessImageQuality } from './src/utils/cv.js';
    import { calculateFencePlan, calculateStairsPlan, estimateFenceMaterials, buildCostEstimate, validateMeasurementForEstimate, formatMeasurement, exportMeasurementsCSV } from './src/utils/geometry.js';
    
    let testsPassed = 0;
    let testsFailed = 0;
    const output = document.getElementById('output');
    
    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `test-result ${type}`;
      div.textContent = message;
      output.appendChild(div);
    }
    
    function section(title) {
      const div = document.createElement('div');
      div.className = 'test-section';
      div.innerHTML = `<h2>${title}</h2>`;
      output.appendChild(div);
    }
    
    function assert(condition, message) {
      if (condition) {
        testsPassed++;
        log(`✓ ${message}`, 'pass');
      } else {
        testsFailed++;
        log(`✗ ${message}`, 'fail');
      }
    }
    
    function assertApprox(actual, expected, tolerance, message) {
      const diff = Math.abs(actual - expected);
      if (diff <= tolerance) {
        testsPassed++;
        log(`✓ ${message} (dejansko: ${actual.toFixed(4)}, pričakovano: ${expected.toFixed(4)})`, 'pass');
      } else {
        testsFailed++;
        log(`✗ ${message} (dejansko: ${actual.toFixed(4)}, pričakovano: ${expected.toFixed(4)}, razlika: ${diff.toFixed(4)})`, 'fail');
      }
    }
    
    window.runAllTests = function() {
      testsPassed = 0;
      testsFailed = 0;
      output.innerHTML = '';
      
      // Test 1: Grayscale conversion
      section('1. Pretvorba v sivinsko sliko');
      {
        const imageData = new ImageData(2, 2);
        imageData.data[0] = 255; imageData.data[1] = 0; imageData.data[2] = 0; imageData.data[3] = 255;
        imageData.data[4] = 0; imageData.data[5] = 255; imageData.data[6] = 0; imageData.data[7] = 255;
        imageData.data[8] = 0; imageData.data[9] = 0; imageData.data[10] = 255; imageData.data[11] = 255;
        imageData.data[12] = 128; imageData.data[13] = 128; imageData.data[14] = 128; imageData.data[15] = 255;
        
        const gray = toGrayscale(imageData);
        
        assertApprox(gray[0], 76.245, 0.01, 'Rdeča piksla → sivinska vrednost');
        assertApprox(gray[1], 149.685, 0.01, 'Zelena piksla → sivinska vrednost');
        assertApprox(gray[2], 29.88, 0.01, 'Modra piksla → sivinska vrednost');
        assertApprox(gray[3], 128, 0.01, 'Siva piksla → sivinska vrednost');
        assert(gray.length === 4, 'Pravilna dolžina polja');
      }
      
      // Test 2: Gaussian blur
      section('2. Gaussovo zabrisovanje');
      {
        const gray = new Float32Array([100, 200, 100, 200]);
        const blurred = gaussianBlur(gray, 2, 2, 1.0);
        
        assert(blurred.length === 4, 'Pravilna dolžina zabrisanega polja');
        assert(blurred[0] >= 100 && blurred[0] <= 200, 'Zabrisane vrednosti v veljavnem obsegu');
        assert(!isNaN(blurred[0]) && isFinite(blurred[0]), 'Ni NaN ali Infinity');
      }
      
      // Test 3: Harris corner detection
      section('3. Harris detekcija značilk');
      {
        const gray = new Float32Array(100 * 100);
        for (let y = 0; y < 100; y++) {
          for (let x = 0; x < 100; x++) {
            if (x < 50 && y < 50) gray[y * 100 + x] = 255;
            else gray[y * 100 + x] = 0;
          }
        }
        
        const features = harrisCornerDetection(gray, 100, 100, 5, 0.04, 0.01, 4);
        
        assert(features.length > 0, `Zaznanih ${features.length} značilk`);
        assert(features.length <= 16, 'Število značilk je razumno (max 16 za 4x4 mrežo)');
        assert(features.every(f => f.point.x >= 0 && f.point.x < 100), 'Vse X koordinate znotraj slike');
        assert(features.every(f => f.point.y >= 0 && f.point.y < 100), 'Vse Y koordinate znotraj slike');
      }
      
      // Test 4: Descriptor computation
      section('4. Izračun deskriptorjev');
      {
        const gray = new Float32Array(100 * 100);
        for (let i = 0; i < gray.length; i++) gray[i] = Math.random() * 255;
        
        const features = harrisCornerDetection(gray, 100, 100);
        if (features.length > 0) {
          computeDescriptors(gray, 100, 100, features);
          
          assert(features[0].descriptor.length === 32, 'Deskriptor ima 32 bajtov');
          assert(features[0].descriptor instanceof Uint8Array, 'Deskriptor je Uint8Array');
        } else {
          log('⚠ Ni značilk za testiranje deskriptorjev', 'info');
        }
      }
      
      // Test 5: Homography - identity
      section('5. Homografija - identiteta');
      {
        const srcPoints = [
          { x: 0, y: 0 }, { x: 100, y: 0 }, { x: 100, y: 100 }, { x: 0, y: 100 }
        ];
        const dstPoints = [...srcPoints];
        
        const result = estimateHomography(srcPoints, dstPoints);
        
        assert(result !== null, 'Homografija uspešno izračunana');
        if (result) {
          assertApprox(result.matrix[0], 1, 0.01, 'H[0] ≈ 1 (identiteta)');
          assertApprox(result.matrix[4], 1, 0.01, 'H[4] ≈ 1 (identiteta)');
          assertApprox(result.matrix[8], 1, 0.01, 'H[8] ≈ 1 (identiteta)');
          assert(result.rmse < 1, `RMSE je majhen (${result.rmse.toFixed(4)})`);
          assert(!isNaN(result.rmse) && isFinite(result.rmse), 'RMSE ni NaN ali Infinity');
        }
      }
      
      // Test 6: Homography - translation
      section('6. Homografija - translacija');
      {
        const srcPoints = [
          { x: 0, y: 0 }, { x: 100, y: 0 }, { x: 100, y: 100 }, { x: 0, y: 100 }
        ];
        const dstPoints = [
          { x: 10, y: 20 }, { x: 110, y: 20 }, { x: 110, y: 120 }, { x: 10, y: 120 }
        ];
        
        const result = estimateHomography(srcPoints, dstPoints);
        
        assert(result !== null, 'Translacijska homografija uspešna');
        if (result) {
          assertApprox(result.matrix[2], 10, 0.5, 'H[2] ≈ 10 (translacija X)');
          assertApprox(result.matrix[5], 20, 0.5, 'H[5] ≈ 20 (translacija Y)');
        }
      }
      
      // Test 7: RANSAC with outliers
      section('7. RANSAC z izstopajočimi točkami');
      {
        const srcPoints = [
          { x: 0, y: 0 }, { x: 100, y: 0 }, { x: 100, y: 100 },
          { x: 0, y: 100 }, { x: 50, y: 50 }, { x: 25, y: 75 }
        ];
        const dstPoints = [
          { x: 10, y: 10 }, { x: 110, y: 10 }, { x: 110, y: 110 },
          { x: 10, y: 110 }, { x: 60, y: 60 }, { x: 200, y: 200 } // Outlier
        ];
        
        const result = ransacHomography(srcPoints, dstPoints, 100, 5.0);
        
        assert(result !== null, 'RANSAC uspešen');
        if (result) {
          assert(result.inlierCount >= 4, `Najdenih ${result.inlierCount} inlierjev (>= 4)`);
          assert(result.inlierCount <= srcPoints.length, 'Število inlierjev je razumno');
          assert(result.rmse < 10, `RMSE je sprejemljiv (${result.rmse.toFixed(2)})`);
          assert(result.inliers.length === srcPoints.length, 'Pravilna dolžina inlier polja');
        }
      }
      
      // Test 8: Degenerate cases
      section('8. Degenerirani primeri');
      {
        // Too few points
        const result1 = estimateHomography(
          [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 0, y: 1 }],
          [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 0, y: 1 }]
        );
        assert(result1 === null, 'Premalo točk (< 4) vrne null');
        
        // Collinear points
        const result2 = estimateHomography(
          [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 2, y: 0 }, { x: 3, y: 0 }],
          [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 2, y: 0 }, { x: 3, y: 0 }]
        );
        // May return null or handle gracefully
        log(`Kolinearne točke: ${result2 === null ? 'pravilno zavrnjene' : 'obravnavane'}`, 'info');
      }
      
      // Test 9: Image quality assessment
      section('9. Ocena kakovosti slike');
      {
        const imageData = new ImageData(100, 100);
        for (let y = 0; y < 100; y++) {
          for (let x = 0; x < 100; x++) {
            const idx = (y * 100 + x) * 4;
            const val = ((x + y) % 20 < 10) ? 255 : 0;
            imageData.data[idx] = val;
            imageData.data[idx + 1] = val;
            imageData.data[idx + 2] = val;
            imageData.data[idx + 3] = 255;
          }
        }
        
        const quality = assessImageQuality(imageData);
        
        assert(quality.sharpness > 0, `Ostrina zaznana (${quality.sharpness.toFixed(3)})`);
        assert(quality.brightness >= 0 && quality.brightness <= 1, 'Svetlost v veljavnem obsegu [0,1]');
        assert(quality.contrast >= 0 && quality.contrast <= 1, 'Kontrast v veljavnem obsegu [0,1]');
        assert(quality.overallScore >= 0 && quality.overallScore <= 1, 'Skupna ocena v veljavnem obsegu [0,1]');
        assert(!isNaN(quality.overallScore) && isFinite(quality.overallScore), 'Ocena ni NaN ali Infinity');
      }
      
      // Test 10: Fence plan calculation
      section('10. Izračun načrta ograje');
      {
        const segments = [
          { startPoint: [0, 0], endPoint: [5, 0], heightChange: 0 },
          { startPoint: [5, 0], endPoint: [10, 0], heightChange: 1 }
        ];
        
        const config = {
          panelWidth: 1.8, panelHeight: 1.5, postWidth: 0.06,
          maxGap: 0.12, mountingStyle: 'stepped', slopeThreshold: 5
        };
        
        const plan = calculateFencePlan(segments, config);
        
        assert(plan.totalLength === 10, `Skupna dolžina je 10m (dejansko: ${plan.totalLength})`);
        assert(plan.totalHeightChange === 1, `Sprememba višine je 1m (dejansko: ${plan.totalHeightChange})`);
        assert(plan.segments.length === 2, `Ima 2 segmenta (dejansko: ${plan.segments.length})`);
        assert(plan.totalPanels > 0, `Ima panele (${plan.totalPanels})`);
        assert(plan.totalPosts > 0, `Ima stebre (${plan.totalPosts})`);
        assert(plan.totalPanels >= plan.segments.length, 'Vsaj toliko panelov kot segmentov');
      }
      
      // Test 11: Stairs plan calculation
      section('11. Izračun načrta stopnic');
      {
        const plan = calculateStairsPlan(5, 1.2, 2.5, 0.9);
        
        assert(plan.numSteps === 5, `Ima 5 stopnic (dejansko: ${plan.numSteps})`);
        assertApprox(plan.totalRise, 1.2, 0.01, 'Skupna višina je 1.2m');
        assertApprox(plan.totalRun, 2.5, 0.01, 'Skupna dolžina je 2.5m');
        assertApprox(plan.averageRise, 0.24, 0.01, 'Povprečna stopnica je 0.24m');
        assertApprox(plan.averageRun, 0.5, 0.01, 'Povprečni gaz je 0.5m');
        assert(plan.steps.length === 5, `Ima 5 objektov stopnic (dejansko: ${plan.steps.length})`);
        assert(plan.railingLength > 0, 'Dolžina ograje je pozitivna');
      }
      
      // Test 12: Material estimation
      section('12. Materialni izračun');
      {
        const segments = [
          { startPoint: [0, 0], endPoint: [10, 0], heightChange: 0 }
        ];
        
        const config = {
          panelWidth: 1.8, panelHeight: 1.5, postWidth: 0.06,
          maxGap: 0.12, mountingStyle: 'level', slopeThreshold: 5
        };
        
        const plan = calculateFencePlan(segments, config);
        const materials = estimateFenceMaterials(plan, {
          panelPricePerM: 85, postPriceEach: 45, railPricePerM: 12,
          fastenerPriceEach: 0.5, endCapPriceEach: 8
        });
        
        assert(materials.length > 0, `Generiranih ${materials.length} materialov`);
        assert(materials.every(m => m.quantity > 0), 'Vse količine so pozitivne');
        assert(materials.every(m => m.totalPrice > 0), 'Vse cene so pozitivne');
        assert(materials.every(m => !isNaN(m.quantity) && isFinite(m.quantity)), 'Nobena količina ni NaN ali Infinity');
        assert(materials.every(m => !isNaN(m.totalPrice) && isFinite(m.totalPrice)), 'Nobena cena ni NaN ali Infinity');
      }
      
      // Test 13: Cost estimate with validation
      section('13. Predračun z validacijo meritev');
      {
        const materials = [
          { id: '1', name: 'Panel', category: 'panels', quantity: 10, unit: 'kos', unitPrice: 50, totalPrice: 500 }
        ];
        
        const measurements = [
          { status: 'verified', scaleSource: 'manual_reference' },
          { status: 'warning', scaleSource: 'unknown' },
          { status: 'invalid', scaleSource: 'demo' }
        ];
        
        const estimate = buildCostEstimate(materials, { hours: 8, rate: 35 }, 0.22, measurements);
        
        assert(estimate.validMeasurements === 1, `1 preverjena meritev (dejansko: ${estimate.validMeasurements})`);
        assert(estimate.warningMeasurements === 1, `1 opozorilna meritev (dejansko: ${estimate.warningMeasurements})`);
        assert(estimate.invalidMeasurements === 1, `1 neveljavna meritev (dejansko: ${estimate.invalidMeasurements})`);
        assert(estimate.subtotal === 500, `Vmesni seštevek je 500 (dejansko: ${estimate.subtotal})`);
        assert(estimate.total > 500, 'Končni znesek vključuje DDV in delo');
        assert(!isNaN(estimate.total) && isFinite(estimate.total), 'Končni znesek ni NaN ali Infinity');
      }
      
      // Test 14: Measurement validation
      section('14. Validacija meritev');
      {
        const v1 = validateMeasurementForEstimate('verified', 'manual_reference');
        assert(v1.canInclude === true, 'Preverjena z ročno referenco se lahko vključi');
        
        const v2 = validateMeasurementForEstimate('invalid', 'manual_reference');
        assert(v2.canInclude === false, 'Neveljavna se ne more vključiti');
        
        const v3 = validateMeasurementForEstimate('warning', 'unknown');
        assert(v3.canInclude === false, 'Opozorilna z neznanim merilom se ne more vključiti');
        
        const v4 = validateMeasurementForEstimate('verified', 'demo');
        assert(v4.canInclude === false, 'Preverjena z demo merilom se ne more vključiti');
        
        const v5 = validateMeasurementForEstimate('verified', 'calibration_marker');
        assert(v5.canInclude === true, 'Preverjena s kalibracijskim markerjem se lahko vključi');
      }
      
      // Test 15: Format measurement
      section('15. Formatiranje meritev');
      {
        const f1 = formatMeasurement(5.123, 'm', 2.5);
        assert(f1.includes('5.123'), 'Format vključuje vrednost');
        assert(f1.includes('m'), 'Format vključuje enoto');
        assert(f1.includes('2.5'), 'Format vključuje negotovost');
        
        const f2 = formatMeasurement(45.6, '°', 1.2);
        assert(f2.includes('45.6'), 'Format kota vključuje vrednost');
        assert(f2.includes('°'), 'Format kota vključuje simbol stopinj');
        
        const f3 = formatMeasurement(123.456, 'cm', 3.0);
        assert(f3.includes('123.4'), 'Format cm vključuje vrednost');
        assert(f3.includes('cm'), 'Format cm vključuje enoto');
      }
      
      // Test 16: CSV export
      section('16. CSV izvoz');
      {
        const measurements = [
          { id: '1', type: 'length', value: 5.123, unit: 'm', status: 'verified', uncertainty: 2.5, source: 'manual', algorithm: 'pixel_distance' },
          { id: '2', type: 'height', value: 1.5, unit: 'm', status: 'warning', uncertainty: 5.0, source: 'homography', algorithm: 'triangulation' }
        ];
        
        const csv = exportMeasurementsCSV(measurements);
        
        assert(csv.includes('ID,Tip,Vrednost'), 'CSV vključuje glavo');
        assert(csv.includes('5.123'), 'CSV vključuje vrednosti');
        assert(csv.includes('verified'), 'CSV vključuje statuse');
        assert(csv.split('\n').length >= 3, 'CSV ima vsaj 3 vrstice (glava + 2 meritve)');
      }
      
      // Test 17: RMSE calculation
      section('17. RMSE izračun');
      {
        // Test with known errors: 3, 4, 5 pixels
        // RMSE = sqrt((9 + 16 + 25) / 3) = sqrt(50/3) = sqrt(16.67) = 4.08
        const srcPoints = [
          { x: 0, y: 0 }, { x: 100, y: 0 }, { x: 100, y: 100 }, { x: 0, y: 100 }
        ];
        const dstPoints = [
          { x: 3, y: 0 }, { x: 100, y: 4 }, { x: 105, y: 100 }, { x: 0, y: 100 }
        ];
        
        const result = estimateHomography(srcPoints, dstPoints);
        assert(result !== null, 'Homografija z napakami uspešna');
        if (result) {
          assert(result.rmse > 0, `RMSE > 0 (${result.rmse.toFixed(2)})`);
          assert(result.rmse < 10, `RMSE < 10 (${result.rmse.toFixed(2)})`);
          assert(isFinite(result.rmse), 'RMSE je končen');
          assert(!isNaN(result.rmse), 'RMSE ni NaN');
        }
      }
      
      // Test 18: Invalid measurements excluded from estimate
      section('18. Neveljavne meritve izključene iz predračuna');
      {
        const materials = [
          { id: '1', name: 'Panel', category: 'panels', quantity: 10, unit: 'kos', unitPrice: 50, totalPrice: 500 }
        ];
        
        // All invalid measurements
        const invalidMeasurements = [
          { status: 'invalid', scaleSource: 'demo' },
          { status: 'invalid', scaleSource: 'unknown' }
        ];
        
        const estimate1 = buildCostEstimate(materials, { hours: 8, rate: 35 }, 0.22, invalidMeasurements);
        
        assert(estimate1.invalidMeasurements === 2, `2 neveljavni meritvi (dejansko: ${estimate1.invalidMeasurements})`);
        assert(estimate1.validMeasurements === 0, `0 veljavnih meritev (dejansko: ${estimate1.validMeasurements})`);
        assert(estimate1.subtotal === 500, `Subtotal je 500 (materiali se ne spremenijo)`);
        
        // Compare with valid measurements
        const validMeasurements = [
          { status: 'verified', scaleSource: 'manual_reference' },
          { status: 'verified', scaleSource: 'calibration_marker' }
        ];
        
        const estimate2 = buildCostEstimate(materials, { hours: 8, rate: 35 }, 0.22, validMeasurements);
        
        assert(estimate2.validMeasurements === 2, `2 veljavni meritvi (dejansko: ${estimate2.validMeasurements})`);
        assert(estimate2.invalidMeasurements === 0, `0 neveljavnih meritev (dejansko: ${estimate2.invalidMeasurements})`);
        assert(estimate2.subtotal === 500, `Subtotal je enak (500) - materiali se ne spremenijo`);
        assert(estimate2.total === estimate1.total, `Končni znesek je enak - meritve ne vplivajo na ceno`);
      }
      
      // Test 19: Sequential fence segments
      section('19. Zaporedni segmenti ograje');
      {
        // Three consecutive segments: 5m, 3m, 4m
        const segments = [
          { startPoint: [0, 0], endPoint: [5, 0], heightChange: 0 },
          { startPoint: [5, 0], endPoint: [8, 0], heightChange: 0 },
          { startPoint: [8, 0], endPoint: [12, 0], heightChange: 0 }
        ];
        
        const config = {
          panelWidth: 1.8, panelHeight: 1.5, postWidth: 0.06,
          maxGap: 0.12, mountingStyle: 'level', slopeThreshold: 5
        };
        
        const plan = calculateFencePlan(segments, config);
        
        assert(plan.totalLength === 12, `Skupna dolžina: 12m (dejansko: ${plan.totalLength}m)`);
        assert(plan.segments.length === 3, `3 segmenti (dejansko: ${plan.segments.length})`);
        assert(plan.segments[0].length === 5, `Segment 1: 5m (dejansko: ${plan.segments[0].length}m)`);
        assert(plan.segments[1].length === 3, `Segment 2: 3m (dejansko: ${plan.segments[1].length}m)`);
        assert(plan.segments[2].length === 4, `Segment 3: 4m (dejansko: ${plan.segments[2].length}m)`);
        
        // Check segment connections
        assert(plan.segments[0].endPoint[0] === plan.segments[1].startPoint[0], 
          'Segment 1 se poveže na segment 2');
        assert(plan.segments[1].endPoint[0] === plan.segments[2].startPoint[0], 
          'Segment 2 se poveže na segment 3');
      }
      
      // Test 20: NaN and Infinity protection
      section('20. Zaščita pred NaN in Infinity');
      {
        // Invalid material prices
        const invalidMaterials = [
          { id: '1', name: 'Panel', category: 'panels', quantity: NaN, unit: 'kos', unitPrice: 50, totalPrice: NaN },
          { id: '2', name: 'Post', category: 'posts', quantity: 10, unit: 'kos', unitPrice: Infinity, totalPrice: Infinity }
        ];
        
        const estimate = buildCostEstimate(invalidMaterials, { hours: 8, rate: 35 }, 0.22, []);
        
        assert(estimate.subtotal === 0, `Subtotal je 0 za neveljavne materiale (dejansko: ${estimate.subtotal})`);
        assert(isFinite(estimate.total), 'Total je končen');
        assert(!isNaN(estimate.total), 'Total ni NaN');
        
        // Invalid tax rate
        const validMaterials = [
          { id: '1', name: 'Panel', category: 'panels', quantity: 10, unit: 'kos', unitPrice: 50, totalPrice: 500 }
        ];
        
        const estimate2 = buildCostEstimate(validMaterials, { hours: 8, rate: 35 }, NaN, []);
        assert(estimate2.taxRate === 0, `Davčna stopnja je 0 za NaN (dejansko: ${estimate2.taxRate})`);
        assert(isFinite(estimate2.total), 'Total je končen z NaN davčno stopnjo');
      }
      
      // Test 17: Edge cases
      section('17. Robni primeri');
      {
        // Empty measurements
        const emptyEstimate = buildCostEstimate([], undefined, 0.22, []);
        assert(emptyEstimate.subtotal === 0, 'Prazen predračun ima subtotal 0');
        assert(emptyEstimate.total === 0, 'Prazen predračun ima total 0');
        
        // Zero labor
        const zeroLaborEstimate = buildCostEstimate(
          [{ id: '1', name: 'Test', category: 'test', quantity: 1, unit: 'kos', unitPrice: 100, totalPrice: 100 }],
          { hours: 0, rate: 35 },
          0.22,
          []
        );
        assert(zeroLaborEstimate.labor.total === 0, 'Nič ur dela = 0 cena dela');
        
        // Negative values should not occur in normal flow
        log('Robni primeri ustrezno obravnavani', 'pass');
      }
      
      // Summary
      const summary = document.createElement('div');
      summary.className = 'summary';
      summary.innerHTML = `
        <h2>📊 Povzetek testov (20 sklopov)</h2>
        <p style="font-size: 18pt; margin: 15px 0;">
          <span class="pass">${testsPassed} uspešnih</span> | 
          <span class="fail">${testsFailed} neuspešnih</span>
        </p>
        <p style="font-size: 14pt;">
          ${testsFailed === 0 
            ? '<span class="pass">✓ VSI TESTI USPEŠNI</span>' 
            : '<span class="fail">✗ NEKATERI TESTI NEUSPEŠNI</span>'}
        </p>
        <div class="warning" style="margin-top: 20px;">
          <strong>⚠ Pomembno:</strong> Ti testi preverjajo matematično pravilnost algoritmov na sintetičnih podatkih. 
          Za profesionalno validacijo je potrebno terensko testiranje na dejanskih fotografijah z znanimi referenčnimi dimenzijami.
        </div>
      `;
      output.appendChild(summary);
    };
    
    window.clearOutput = function() {
      output.innerHTML = '';
      testsPassed = 0;
      testsFailed = 0;
    };
  </script>
